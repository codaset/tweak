version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
  # The e2e fixtures, one entry each, every update in one PR per fixture. A
  # red one is the point: a framework changed the metadata a mapper reads
  # (design.md § Fixture apps). Add an entry with each new fixture.
  - package-ecosystem: npm
    directory: /fixtures/static
    schedule:
      interval: monthly
    groups:
      static:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /fixtures/rails
    schedule:
      interval: monthly
    groups:
      rails:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fixtures/vite-react18
    schedule:
      interval: monthly
    groups:
      vite-react18:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fixtures/vite-react19
    schedule:
      interval: monthly
    groups:
      vite-react19:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fixtures/vite-vue
    schedule:
      interval: monthly
    groups:
      vite-vue:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fixtures/sveltekit
    schedule:
      interval: monthly
    groups:
      sveltekit:
        patterns: ["*"]
