name: CI

on:
  push:
  pull_request:
  # The release workflow runs every job here first.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from the release workflow, github.workflow is "Release", so the
  # release's CI run never cancels, or is cancelled by, a push to main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile all targets
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/tweak-$os-$arch$ext" ./cmd/tweak
          done
          ls -l dist
      # The release's licence check, so a new dependency's licence fails here
      # first: every module compiled for any target needs an allowlisted one.
      - name: Go licence notices
        if: runner.os == 'Linux'
        run: go run ./scripts/notices >/dev/null

  js:
    runs-on: ubuntu-latest
    env:
      # Only the e2e job needs the browser.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chrome for Testing version
        id: chrome
        run: echo "version=$(node -p 'require("./.puppeteerrc.cjs").chrome.version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: chrome-for-testing-${{ runner.os }}-${{ steps.chrome.outputs.version }}
      # The pinned version from .puppeteerrc.cjs; nothing to do on a cache hit.
      - run: npx puppeteer browsers install chrome
      - run: npm run e2e

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Versions agree
        run: node scripts/check-consistency.js
      - name: Launcher is executable
        run: test -x plugins/codaset/bin/tweak
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate the plugin and marketplace
        run: |
          claude plugin validate plugins/codaset
          claude plugin validate .
