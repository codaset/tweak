name: CI

on:
  push:
  pull_request:
  # The release workflow runs every job here first.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from the release workflow, github.workflow is "Release", so the
  # release's CI run never cancels, or is cancelled by, a push to main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # The race detector on Linux only: a data race doesn't depend on the OS,
      # and -race roughly doubles the slower packages on macOS's runners.
      - run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...
      - name: Cross-compile all targets
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/tweak-$os-$arch$ext" ./cmd/tweak
          done
          ls -l dist
      # The release's licence check, so a new dependency's licence fails here
      # first: every module compiled for any target needs an allowlisted one.
      - name: Go licence notices
        if: runner.os == 'Linux'
        run: go run ./scripts/notices >/dev/null

  js:
    runs-on: ubuntu-latest
    env:
      # Only the e2e job needs the browser.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The rails fixture's Ruby and gems (.ruby-version, Gemfile.lock), the
      # gems installed in fixtures/rails/vendor, which the runner links into
      # each copy of the fixture.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: fixtures/rails
          bundler-cache: true
      # The browser comes from the cache, or on a miss from the install step,
      # never from npm ci.
      - name: Chrome for Testing version
        id: chrome
        run: echo "version=$(node -p 'require("./.puppeteerrc.cjs").chrome.version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: chrome-cache
        with:
          path: ~/.cache/puppeteer
          key: chrome-for-testing-${{ runner.os }}-${{ steps.chrome.outputs.version }}
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Install Chrome for Testing (cache miss)
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome
      # The Vite fixtures' own dependencies, from their lockfiles, which the
      # runner links into each copy of the fixture.
      - run: npm ci --prefix fixtures/vite-react18
      - run: npm ci --prefix fixtures/vite-react19
      - run: npm ci --prefix fixtures/vite-vue
      - run: npm ci --prefix fixtures/sveltekit
      - run: npm run e2e

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Versions agree
        run: node scripts/check-consistency.js
      - name: Launcher is executable
        run: test -x plugins/codaset/bin/tweak
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate the plugin and marketplace
        run: |
          claude plugin validate plugins/codaset
          claude plugin validate .
